version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: rythu-seva-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rythu_seva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rythu-seva-network

volumes:
  postgres_data:

networks:
  rythu-seva-network:
    driver: bridge
